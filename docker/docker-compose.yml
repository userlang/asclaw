services:
  caddy:
    image: caddy:2.8-alpine
    container_name: asclaw-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - asclaw_network
    depends_on:
      - asclaw_studio
      - asclaw_server

  asclaw_studio:
    build:
      context: ./frontend/studio
      dockerfile: Dockerfile
    container_name: asclaw-studio
    image: asclaw_studio:latest
    ports:
      - "3000:3000"
    volumes:
      - ./web/studio/.env.production:/app/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - asclaw_network
    depends_on:
      - asclaw_server
    restart: always

  asclaw_server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asclaw_server:latest
    container_name: asclaw-server
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - asclaw_mysql
      - asclaw_redis
      - asclaw_worker
    volumes:
      - ./backend/deploy/.env.server:/asclaw/backend/.env
    networks:
      - asclaw_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s asclaw_mysql:3306 -s asclaw_redis:6379 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  asclaw_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=celery
    image: asclaw_celery:latest
    container_name: asclaw-worker
    restart: always
    ports:
      - "8555:8555"
    depends_on:
      - asclaw_redis
    volumes:
      - ./backend/deploy/.env.server:/asclaw/backend/.env
    networks:
      - asclaw_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s asclaw_redis:6379 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  asclaw_mysql:
    image: mysql:8.0.41
    ports:
      - "${DOCKER_MYSQL_MAP_PORT:-3306}:3306"
    container_name: asclaw-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - asclaw_mysql:/var/lib/mysql
      - ./sql/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - asclaw_network
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower_case_table_names=1

  #  asclaw_postgres:
  #    image: postgres:16
  #    ports:
  #      - "${DOCKER_POSTGRES_MAP_PORT:-5432}:5432"
  #    container_name: asclaw-postgres
  #    restart: always
  #    environment:
  #      POSTGRES_DB: asclaw
  #      POSTGRES_PASSWORD: 123456
  #      TZ: Asia/Shanghai
  #    volumes:
  #      - asclaw_postgres:/var/lib/postgresql/data
  #    networks:
  #      - asclaw_network

  asclaw_redis:
    image: redis
    ports:
      - "${DOCKER_REDIS_MAP_PORT:-6379}:6379"
    container_name: asclaw-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - asclaw_redis:/data
    networks:
      - asclaw_network

networks:
  asclaw_network:
    name: asclaw_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.10.0/24

volumes:
  asclaw_mysql:
    name: asclaw_mysql
  asclaw_redis:
    name: asclaw_redis
  asclaw_postgres:
    name: asclaw_postgres
  caddy_data:
  caddy_config: